; Standalone-Fingerprint-Key firmware
;
;   pio run -e esp32s3          build
;   pio run -e esp32s3 -t upload
;   pio device monitor          open the admin console
;   pio test -e native          run the protocol tests on this machine
;
; The board entry is the generic S3 DevKitC: it matches the chip, the flash size
; and the USB configuration of most small S3 boards. If yours differs, change the
; board line and the pins in include/config.h; nothing else is board-specific.

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = direct

; ARDUINO_USB_MODE=0 selects the TinyUSB stack, which is what makes the HID
; keyboard interface possible; with the default (=1) the S3 exposes only the
; hardware CDC and Keyboard.h silently does nothing.
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -Wall
    -Wextra

; The board is not involved in the protocol tests, so they never run here.
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
test_filter = test_protocol
